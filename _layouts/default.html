<!doctype html>
<html lang="en">

  {% include head.html %}

  <body>

    <div class="container content">
      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ site.baseurl }}/" title="Home"><img class="masthead-logo" src="{{ '/assets/silvasonic-logo.png' | relative_url }}" alt="" width="24" height="24">{{ site.title }}</a><small> &mdash; {{ site.tagline }}</small>
        </h3>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <small>
          Copyright &copy; <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: '%Y' }}</time> Silvasonic &mdash; I'm Doing Side Quests. All rights reserved.
        </small>
      </footer>
    </div>

{% if site.ga_analytics %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga_analytics }}');
</script>
{% endif %}

  </body>
</html>
