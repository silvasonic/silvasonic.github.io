<!doctype html>
<html lang="en">

  {% include head.html %}

  <body>

    <div class="container content">
      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ site.baseurl }}/" title="Home"><picture><source srcset="{{ '/assets/silvasonic-mark-cream.svg' | relative_url }}" media="(prefers-color-scheme: dark)"><img class="masthead-logo" src="{{ '/assets/silvasonic-mark.svg' | relative_url }}" alt="" width="32" height="32"></picture>{{ site.title }}</a><small> &mdash; {{ site.tagline }}</small>
        </h3>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <small>
          Copyright &copy; <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: '%Y' }}</time> Silvasonic &mdash; I'm Doing Side Quests. All rights reserved.
        </small>
      </footer>
    </div>

  </body>
</html>
