# Setup
title: Silvasonic
tagline: I'm Doing Side Quests
url: https://silvasonic.com
paginate: 5
paginate_path: "/page/:num/" # matches the WordPress URL shape; default is /page:num/
baseurl: ""
permalink: pretty

# Defaults
defaults:
  - scope:
      path: "assets/images"
    values:
      image: true

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - _scripts
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
ga_analytics: G-QQ4LDX9EQF

# Specify the author for blog posts
author:
  name: Pablo Silva
  url: https://silvasonic.com
  email: pablo@silvasonic.com

# Custom vars
version: 3.0.0
